schema_version: 1
language: node
defaults:
  app_name: CLI-first Node app
  app_slug: cli-first-node-app
  cli_name: appctl
  go_module: example.com/cli-first-node-app
  lathe_version: v0.4.4
replacements:
  - variable: app_name
    files: [README.md]
  - variable: app_name
    from: CLI-first Node application
    files: [openapi/openapi.yaml]
  - variable: app_slug
    files: [package.json]
  - variable: cli_name
    files: [.github/workflows/ci.yml, AGENTS.md, README.md, cli.yaml, cmd/appctl/cli.yaml, package.json, test/cli.test.mjs]
  - variable: go_module
    files: [go.mod, cmd/appctl/main.go]
  - variable: lathe_version
    files: [go.mod, package.json]
renames:
  - from: cmd/appctl
    variable: cli_name
generated: [internal/generated, skills/appctl]
cleanup: [.cache, bin, node_modules]
check_profile: pnpm
